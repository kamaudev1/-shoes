<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SoulHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0d0d0d;
            --gold-primary: #d1b27c;
            --gold-gradient: linear-gradient(135deg, #e2cba7 0%, #c19b52 100%);
            --font-heading: 'Cinzel', serif;
            --font-body: 'Lato', sans-serif;
            --error: #ff4d4d;
            --success: #4dff88;
        }
        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: var(--font-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
        }
        h1 {
            font-family: var(--font-heading);
            font-size: 36px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #a0a0a0;
        }
        input, select {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
            appearance: none;
        }
        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23d1b27c%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
        }
        select option {
            background-color: #1a1a1a;
            color: #fff;
        }
        input:focus, select:focus {
            border-color: var(--gold-primary);
        }
        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 8px;
            font-family: var(--font-heading);
            font-size: 18px;
            background: transparent;
            color: #fff;
            border: 1px solid var(--gold-primary);
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s, transform 0.1s, opacity 0.3s;
        }
        .btn:hover:not(:disabled) { background: rgba(209, 178, 124, 0.1); }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #a0a0a0;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--gold-primary); }
        
        /* Status Messages */
        .message {
            display: none;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: left;
            line-height: 1.4;
        }
        .message.error {
            display: block;
            background: rgba(255, 77, 77, 0.1);
            color: var(--error);
            border: 1px solid rgba(255, 77, 77, 0.3);
        }
        .message.success {
            display: block;
            background: rgba(77, 255, 136, 0.1);
            color: var(--success);
            border: 1px solid rgba(77, 255, 136, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Join SoulHub</h1>
        
        <!-- Message Container -->
        <div id="status-message" class="message"></div>

        <form id="register-form">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Create a password" minlength="6">
            </div>
            <div class="input-group">
                <label for="role">Role</label>
                <select id="role" required>
                    <option value="" disabled selected>Select your role</option>
                    <option value="owner">Shop Owner</option>
                    <option value="manager">Manager</option>
                    <option value="sales">Sales Associate</option>
                </select>
            </div>
            <button type="submit" id="submit-btn" class="btn">Create Account</button>
        </form>
        
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        // Wrap everything in DOMContentLoaded to ensure HTML elements exist before JS runs
        document.addEventListener('DOMContentLoaded', () => {
            
            const form = document.getElementById('register-form');
            const submitBtn = document.getElementById('submit-btn');
            const messageDiv = document.getElementById('status-message');

            // Helper function to display messages
            const showMessage = (text, type) => {
                messageDiv.innerText = text;
                messageDiv.className = `message ${type}`;
            };

            // Helper function to reset the button state
            const resetButton = () => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Create Account";
            };

            // 1. Check if Supabase CDN loaded
            if (typeof supabase === 'undefined') {
                showMessage("System Error: Failed to load database library. Please check your internet connection and refresh.", "error");
                submitBtn.disabled = true;
                console.error("Supabase CDN failed to load.");
                return;
            }

            // 2. Initialize Supabase
            const supabaseUrl = 'https://ragcmdottawgtqspwfdw.supabase.co';
            const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhZ2NtZG90YXdndHFzcHdmZHciLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MjQ2MTMwNSwiZXhwIjoyMTA4MDM3MzA1fQ.F3IlMYB-inlls9pEFaCFtPCscamvgN-lJBBEyF6hxFc';
            
            let supabaseClient;
            try {
                supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
            } catch (err) {
                showMessage("System Error: Failed to initialize database connection.", "error");
                submitBtn.disabled = true;
                console.error("Supabase init error:", err);
                return;
            }

            // 3. Handle Form Submission
            form.addEventListener('submit', async (e) => {
                e.preventDefault(); 
                
                // Clear previous messages
                messageDiv.className = 'message';
                messageDiv.style.display = 'none';

                // Get form values
                const fullName = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const role = document.getElementById('role').value;

                // Basic Frontend Validation
                if (!fullName || !email || !password || !role) {
                    showMessage("Please fill out all fields.", "error");
                    return;
                }
                if (password.length < 6) {
                    showMessage("Password must be at least 6 characters long.", "error");
                    return;
                }

                // Set Loading State
                submitBtn.disabled = true;
                submitBtn.innerText = "Creating Account...";

                try {
                    // Call Supabase Auth
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                full_name: fullName,
                                role: role
                            }
                        }
                    });

                    // Handle Supabase-specific errors
                    if (error) throw error;

                    // Success!
                    showMessage("Account created successfully! Redirecting to login...", "success");
                    submitBtn.innerText = "Account Created";
                    form.reset();

                    // Redirect after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);

                } catch (error) {
                    console.error("Registration Error:", error);
                    
                    // Map error messages to user-friendly text
                    let errorMsg = error.message || "An unexpected error occurred.";
                    
                    if (errorMsg.includes("User already registered") || errorMsg.includes("already been registered")) {
                        errorMsg = "This email is already registered. Try logging in instead.";
                    } else if (errorMsg.includes("Password should be")) {
                        errorMsg = "Password is too weak. Please use a stronger password.";
                    } else if (errorMsg.includes("Invalid email")) {
                        errorMsg = "Please enter a valid email address.";
                    } else if (errorMsg.includes("Database error")) {
                        errorMsg = "Database error. Ensure you have disabled 'Confirm email' in Supabase settings if testing.";
                    }

                    showMessage(errorMsg, "error");
                    
                    // Reset button ONLY on error, so they can try again
                    resetButton(); 
                }
            });
        });
    </script>
</body>
    </html>
