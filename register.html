<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SoulHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0d0d0d;
            --gold-primary: #d1b27c;
            --gold-gradient: linear-gradient(135deg, #e2cba7 0%, #c19b52 100%);
            --font-heading: 'Cinzel', serif;
            --font-body: 'Lato', sans-serif;
            --error: #ff4d4d;
            --success: #4dff88;
        }
        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: var(--font-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
        }
        h1 {
            font-family: var(--font-heading);
            font-size: 36px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #a0a0a0;
        }
        input, select {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
            appearance: none; /* Removes default OS styling for select */
        }
        /* Add custom dropdown arrow */
        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23d1b27c%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
        }
        select option {
            background-color: #1a1a1a;
            color: #fff;
        }
        input:focus, select:focus {
            border-color: var(--gold-primary);
        }
        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 8px;
            font-family: var(--font-heading);
            font-size: 18px;
            background: transparent;
            color: #fff;
            border: 1px solid var(--gold-primary);
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s, transform 0.1s;
        }
        .btn:hover { background: rgba(209, 178, 124, 0.1); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #a0a0a0;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--gold-primary); }
        
        /* Status Messages */
        .message {
            display: none;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .message.error {
            display: block;
            background: rgba(255, 77, 77, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }
        .message.success {
            display: block;
            background: rgba(77, 255, 136, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Join SoulHub</h1>
        
        <!-- Message Container -->
        <div id="status-message" class="message"></div>

        <form id="register-form">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Create a password" minlength="6">
            </div>
            <div class="input-group">
                <label for="role">Role</label>
                <select id="role" required>
                    <option value="" disabled selected>Select your role</option>
                    <option value="owner">Shop Owner</option>
                    <option value="manager">Manager</option>
                    <option value="sales">Sales Associate</option>
                </select>
            </div>
            <button type="submit" id="submit-btn" class="btn">Create Account</button>
        </form>
        
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        // 1. Initialize Supabase
        const supabaseUrl = 'https://ragcmdottawgtqspwfdw.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhZ2NtZG90YXdndHFzcHdmZHciLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MjQ2MTMwNSwiZXhwIjoyMTA4MDM3MzA1fQ.F3IlMYB-inlls9pEFaCFtPCscamvgN-lJBBEyF6hxFc';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Handle Form Submission
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent page reload

            // Get DOM elements
            const submitBtn = document.getElementById('submit-btn');
            const messageDiv = document.getElementById('status-message');
            
            // Get form values
            const fullName = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            // UI Updates: Loading state
            submitBtn.disabled = true;
            submitBtn.innerText = "Creating Account...";
            messageDiv.className = 'message'; // Reset message
            messageDiv.style.display = 'none';

            try {
                // 3. Call Supabase Auth to sign up the user
                // We pass the full_name and role inside the "options.data" object.
                // This stores them securely in Supabase's "user_metadata".
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            role: role
                        }
                    }
                });

                if (error) throw error;

                // Success!
                messageDiv.innerText = "Account created successfully! Please check your email to verify.";
                messageDiv.className = 'message success';
                document.getElementById('register-form').reset();
                submitBtn.innerText = "Account Created";

                // Optional: Redirect to login after 3 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);

            } catch (error) {
                // Error handling
                console.error("Signup Error:", error.message);
                messageDiv.innerText = error.message;
                messageDiv.className = 'message error';
                
                // Reset button
                submitBtn.disabled = false;
                submitBtn.innerText = "Create Account";
            }
        });
    </script>
</body>
  </html>
