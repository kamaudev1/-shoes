        Reports

    </div>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="top-header">
      <button class="menu-toggle" id="menu-toggle">☰</button>
      <h1>Suppliers</h1>
    </header>

    <div class="inventory-header">
      <input type="text" id="search-supplier" class="search-bar" placeholder="Search by company or contact..." style="max-width: 400px; margin-bottom: 0;">
      <button class="btn-gold" onclick="openSupplierModal()">+ Add Supplier</button>
    </div>

    <div class="table-responsive" style="margin-top: 20px;">
      <table class="data-table">
        <thead>
          <tr>
            <th>Company Name</th>
            <th>Contact Person</th>
            <th>Phone Number</th>
            <th>Email</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="suppliers-table-body">
          <tr><td colspan="6" style="text-align: center; color: var(--muted);">Loading suppliers...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- ADD SUPPLIER MODAL -->
    <div class="modal" id="supplier-modal">
      <div class="modal-content" style="max-width: 500px;">
        <span class="close-modal" onclick="closeSupplierModal()">&times;</span>
        <h2 style="font-family: 'Cinzel', serif; margin-bottom: 20px;">Add New Supplier</h2>
        <form id="add-supplier-form">
          <div class="form-grid">
            <div class="form-group full">
              <label>Company / Brand Name</label>
              <input type="text" id="s-company" required placeholder="e.g. Italian Leather Co.">
            </div>
            <div class="form-group">
              <label>Contact Person</label>
              <input type="text" id="s-contact" placeholder="e.g. Mario Rossi">
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="s-phone" placeholder="e.g. 0712 345 678">
            </div>
            <div class="form-group full">
              <label>Email Address</label>
              <input type="email" id="s-email" placeholder="e.g. orders@italianleather.com">
            </div>
            <div class="form-group full">
              <label>Notes (Delivery times, minimum orders, etc.)</label>
              <input type="text" id="s-notes" placeholder="e.g. Delivers every Tuesday, minimum order 10 pairs">
            </div>
          </div>
          <button type="submit" class="btn-gold" style="width: 100%; margin-top: 20px;">Save Supplier</button>
        </form>
      </div>
    </div>
  </main>

  <!-- LOAD SHARED APP.JS -->
  <script src="app.js"></script>
  
  <!-- PAGE SPECIFIC LOGIC -->
  <script>
    let allSuppliers = [];

    // Wait for auth to be ready
    window.addEventListener('appReady', () => {
        loadSuppliers();

        // Setup Search
        document.getElementById('search-supplier').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allSuppliers.filter(s => 
                s.company_name.toLowerCase().includes(term) || 
                (s.contact_person && s.contact_person.toLowerCase().includes(term))
            );
            renderSupplierTable(filtered);
        });
    });

    // Fetch Data
    async function loadSuppliers() {
        const tbody = document.getElementById('suppliers-table-body');
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--muted);">Loading suppliers...</td></tr>`;

        const { data, error } = await supabaseClient
            .from('suppliers')
            .select('*')
            .order('company_name', { ascending: true });

        if (error) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--error);">Error: ${error.message}</td></tr>`;
            return;
        }

        allSuppliers = data;
        renderSupplierTable(allSuppliers);
    }

    // Render Table
    function renderSupplierTable(suppliers) {
        const tbody = document.getElementById('suppliers-table-body');
        tbody.innerHTML = '';

        if (suppliers.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--muted); padding: 20px;">No suppliers found. Click "+ Add Supplier" to get started.</td></tr>`;
            return;
        }

        suppliers.forEach(s => {
            // Only show delete button to owners and managers
            const deleteBtn = (window.currentUserRole === 'owner' || window.currentUserRole === 'manager') 
                ? `<button class="btn-delete" onclick="deleteSupplier('${s.id}')">Delete</button>` 
                : '-';

            tbody.innerHTML += `
                <tr>
                  <td style="font-weight: 600; color: var(--gold-light);">${s.company_name}</td>
                  <td>${s.contact_person || '-'}</td>
                  <td>${s.phone || '-'}</td>
                  <td>${s.email || '-'}</td>
                  <td style="font-size: 13px; color: var(--muted); max-width: 200px;">${s.notes || '-'}</td>
                  <td>${deleteBtn}</td>
                </tr>
            `;
        });
    }

    // Modal Controls
    window.openSupplierModal = () => document.getElementById('supplier-modal').classList.add('active');
    window.closeSupplierModal = () => {
        document.getElementById('supplier-modal').classList.remove('active');
        document.getElementById('add-supplier-form').reset();
    }

    // Save Supplier
    document.getElementById('add-supplier-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.textContent = "Saving...";
        btn.disabled = true;

        const newSupplier = {
            company_name: document.getElementById('s-company').value.trim(),
            contact_person: document.getElementById('s-contact').value.trim(),
            phone: document.getElementById('s-phone').value.trim(),
            email: document.getElementById('s-email').value.trim(),
            notes: document.getElementById('s-notes').value.trim(),
        };

        const { error } = await supabaseClient.from('suppliers').insert([newSupplier]);

        if (error) {
            alert("Error saving supplier: " + error.message);
            btn.textContent = "Save Supplier";
            btn.disabled = false;
        } else {
            closeSupplierModal();
            loadSuppliers(); 
        }
    });

    // Delete Supplier
    window.deleteSupplier = async function(id) {
        if (!confirm("Are you sure you want to delete this supplier? This cannot be undone.")) return;

        const { error } = await supabaseClient
            .from('suppliers')
            .delete()
            .eq('id', id);

        if (error) {
            alert("Error deleting supplier: " + error.message);
        } else {
            loadSuppliers(); // Refresh table
        }
    }
  </script>
</body>
</html>
