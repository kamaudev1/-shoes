<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory - SoulHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Edit button style */
    .btn-edit {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
      margin-right: 8px;
    }
    .btn-edit:hover {
      background: rgba(209, 178, 124, 0.1);
    }
    .product-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      border-top: 1px solid #333;
      padding-top: 15px;
    }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><h2>SoulHub</h2></div>
    <div class="user-profile">
      <div class="avatar" id="user-initial">S</div>
      <div class="user-info">
        <h4 id="user-name">Loading...</h4>
        <span class="role-badge" id="user-role">...</span>
      </div>
    </div>
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Overview
      </a>
      <a href="inventory.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
        Inventory
      </a>
      <a href="sales.html" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Sales (POS)
      </a>
      <a href="reports.html" class="nav-item">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        Reports
      </a>
      <a href="customers.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Customers
      </a>
      <a href="suppliers.html" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
        Suppliers
      </a>
      <a href="staff.html" class="nav-item owner-only" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
        Staff
      </a>
      <a href="settings.html" class="nav-item owner-only" style="display:none;">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Settings
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" id="logout-btn">Log Out</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <button class="menu-toggle" id="menu-toggle">☰</button>
      <h1>Inventory</h1>
    </header>

    <div id="inventory-container">
      <div class="inventory-header">
        <input type="text" id="search-input" class="search-bar" placeholder="Search by name, brand, or category..." style="max-width: 400px; margin-bottom: 0;">
        <button class="btn-gold" id="add-btn" onclick="openAddModal()" style="display: none;">+ Add New Shoe</button>
      </div>
      
      <div class="product-grid" id="product-grid" style="margin-top: 20px;">
        <p style="color: var(--muted);">Loading inventory...</p>
      </div>
    </div>

    <!-- ADD / EDIT PRODUCT MODAL -->
    <div class="modal" id="add-product-modal">
      <div class="modal-content">
        <span class="close-modal" onclick="closeAddModal()">&times;</span>
        <h2 id="modal-title" style="font-family: 'Cinzel', serif; margin-bottom: 20px;">Add New Shoe</h2>
        <form id="add-product-form">
          <div class="form-grid">
            
            <!-- Image Upload Section -->
            <div class="form-group full">
              <label>Product Image</label>
              <div class="file-upload-wrapper" onclick="document.getElementById('p-image-file').click()">
                <span class="file-upload-text" id="upload-text">Click to upload an image</span>
                <img id="image-preview" class="image-preview" src="" alt="Preview">
                <input type="file" id="p-image-file" accept="image/*" onchange="previewImage(event)">
              </div>
            </div>

            <div class="form-group full">
              <label>Product Name</label>
              <input type="text" id="p-name" required placeholder="e.g. Classic Stiletto">
            </div>
            <div class="form-group">
              <label>Brand</label>
              <input type="text" id="p-brand" placeholder="e.g. Jimmy Choo">
            </div>
            <div class="form-group">
              <label>Category</label>
              <input type="text" id="p-category" placeholder="e.g. Heels">
            </div>
            <div class="form-group">
              <label>Cost Price (KSh)</label>
              <input type="number" id="p-cost-price" required min="0" step="0.01" placeholder="e.g. 8000">
            </div>
            <div class="form-group">
              <label>Selling Price (KSh)</label>
              <input type="number" id="p-price" required min="0" step="0.01" placeholder="e.g. 15000">
            </div>
            
            <div class="form-group full" style="margin-top: 10px; border-top: 1px solid #333; padding-top: 15px;">
              <label>Stock by Size</label>
            </div>
            <div class="form-group"><label>Size 38</label><input type="number" id="s-38" value="0" min="0"></div>
            <div class="form-group"><label>Size 39</label><input type="number" id="s-39" value="0" min="0"></div>
            <div class="form-group"><label>Size 40</label><input type="number" id="s-40" value="0" min="0"></div>
            <div class="form-group"><label>Size 41</label><input type="number" id="s-41" value="0" min="0"></div>
            <div class="form-group"><label>Size 42</label><input type="number" id="s-42" value="0" min="0"></div>
          </div>
          <button type="submit" id="save-btn" class="btn-gold" style="width: 100%; margin-top: 20px;">Save to Inventory</button>
        </form>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    let allProducts = [];
    let editingProductId = null;   // null = Add mode, uuid = Edit mode
    let editingImageUrl = null;    // Keep track of the current image during edit

    // Wait for app.js to finish the auth check before doing anything
    window.addEventListener('appReady', () => {
        // Show Add button only for Owner/Manager
        if (window.currentUserRole === 'owner' || window.currentUserRole === 'manager') {
            document.getElementById('add-btn').style.display = 'block';
        }
        loadProducts();

        // Setup search
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(term) || 
                (p.brand && p.brand.toLowerCase().includes(term)) ||
                (p.category && p.category.toLowerCase().includes(term))
            );
            renderGrid(filtered);
        });
    });

    async function loadProducts() {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '<p style="color: var(--muted);">Loading inventory...</p>';

        const { data: products, error } = await supabaseClient
            .from('products')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            grid.innerHTML = `<p style="color: var(--error);">Error: ${error.message}</p>`;
            return;
        }

        allProducts = products;
        renderGrid(allProducts);
    }

    function renderGrid(products) {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '';
        const isManager = window.currentUserRole === 'owner' || window.currentUserRole === 'manager';

        if (products.length === 0) {
            grid.innerHTML = `<p style="color: var(--muted);">No shoes found.</p>`;
            return;
        }

        products.forEach(p => {
            const sizes = [38, 39, 40, 41, 42];
            let sizeHtml = '';
            sizes.forEach(size => {
                const qty = p[`size_${size}`] || 0;
                let badgeClass = qty === 0 ? 'out' : (qty <= 2 ? 'low' : '');
                sizeHtml += `<span class="size-badge ${badgeClass}">${size}: ${qty}</span>`;
            });

            const priceStr = new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES' }).format(p.price);
            
            // Only show action buttons to Owners/Managers
            const actionBtns = isManager 
                ? `<button class="btn-edit" onclick="openEditModal('${p.id}')">Edit</button>
                   <button class="btn-delete" onclick="deleteProduct('${p.id}')">Delete</button>` 
                : '';

            grid.innerHTML += `
                <div class="product-card">
                  <img src="${p.image_url || 'https://via.placeholder.com/300x200?text=No+Image'}" alt="${p.name}" class="product-image">
                  <div class="product-info">
                    <h3>${p.name}</h3>
                    <p>${p.brand || 'Unknown Brand'} • ${p.category || 'Shoes'}</p>
                    <div class="product-price">${priceStr}</div>
                    <div class="size-grid">${sizeHtml}</div>
                    <div class="product-actions">${actionBtns}</div>
                  </div>
                </div>
            `;
        });
    }

    // --- IMAGE PREVIEW ---
    window.previewImage = function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('image-preview');
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('upload-text').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    }

    // --- MODAL CONTROLS ---
    window.openAddModal = () => {
        editingProductId = null;
        editingImageUrl = null;
        document.getElementById('modal-title').textContent = 'Add New Shoe';
        document.getElementById('save-btn').textContent = 'Save to Inventory';
        document.getElementById('add-product-modal').classList.add('active');
    };

    window.openEditModal = (id) => {
        const product = allProducts.find(p => p.id === id);
        if (!product) return;

        editingProductId = id;
        editingImageUrl = product.image_url;

        document.getElementById('modal-title').textContent = 'Edit Shoe';
        document.getElementById('save-btn').textContent = 'Update Inventory';

        // Prepopulate all fields
        document.getElementById('p-name').value = product.name || '';
        document.getElementById('p-brand').value = product.brand || '';
        document.getElementById('p-category').value = product.category || '';
        document.getElementById('p-cost-price').value = product.cost_price || 0;
        document.getElementById('p-price').value = product.price || 0;
        document.getElementById('s-38').value = product.size_38 || 0;
        document.getElementById('s-39').value = product.size_39 || 0;
        document.getElementById('s-40').value = product.size_40 || 0;
        document.getElementById('s-41').value = product.size_41 || 0;
        document.getElementById('s-42').value = product.size_42 || 0;

        // Show the existing image in the preview
        const img = document.getElementById('image-preview');
        if (product.image_url) {
            img.src = product.image_url;
            img.style.display = 'block';
            document.getElementById('upload-text').style.display = 'none';
        } else {
            img.style.display = 'none';
            document.getElementById('upload-text').style.display = 'block';
        }

        document.getElementById('add-product-modal').classList.add('active');
    };

    window.closeAddModal = () => {
        document.getElementById('add-product-modal').classList.remove('active');
        document.getElementById('add-product-form').reset();
        document.getElementById('image-preview').style.display = 'none';
        document.getElementById('upload-text').style.display = 'block';
        editingProductId = null;
        editingImageUrl = null;
    };

    // --- SAVE PRODUCT (Handles Both Add & Edit) ---
    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('save-btn');
        btn.textContent = "Saving...";
        btn.disabled = true;

        try {
            // Start with existing image (or placeholder for new)
            let imageUrl = editingImageUrl || 'https://via.placeholder.com/300x200?text=No+Image';
            const fileInput = document.getElementById('p-image-file');
            
            // If a new image was selected, upload it
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}-${Math.random().toString(36).substring(7)}.${fileExt}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('shoe-images')
                    .upload(fileName, file);
                if (uploadError) throw uploadError;

                const { data: urlData } = supabaseClient.storage
                    .from('shoe-images')
                    .getPublicUrl(fileName);

                // If we're editing and had an old image, delete the old one from Storage
                if (editingProductId && editingImageUrl && editingImageUrl.includes('shoe-images')) {
                    const oldFileName = editingImageUrl.split('/').pop();
                    await supabaseClient.storage.from('shoe-images').remove([oldFileName]);
                }

                imageUrl = urlData.publicUrl;
            }

            // Build the product object
            const productData = {
                name: document.getElementById('p-name').value,
                brand: document.getElementById('p-brand').value,
                category: document.getElementById('p-category').value,
                cost_price: parseFloat(document.getElementById('p-cost-price').value) || 0,
                price: parseFloat(document.getElementById('p-price').value),
                image_url: imageUrl,
                size_38: parseInt(document.getElementById('s-38').value) || 0,
                size_39: parseInt(document.getElementById('s-39').value) || 0,
                size_40: parseInt(document.getElementById('s-40').value) || 0,
                size_41: parseInt(document.getElementById('s-41').value) || 0,
                size_42: parseInt(document.getElementById('s-42').value) || 0,
            };

            // Insert or Update based on mode
            let dbError;
            if (editingProductId) {
                const { error } = await supabaseClient
                    .from('products')
                    .update(productData)
                    .eq('id', editingProductId);
                dbError = error;
            } else {
                const { error } = await supabaseClient
                    .from('products')
                    .insert([productData]);
                dbError = error;
            }

            if (dbError) throw dbError;

            closeAddModal();
            loadProducts();

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.textContent = editingProductId ? "Update Inventory" : "Save to Inventory";
            btn.disabled = false;
        }
    });

    // --- DELETE PRODUCT ---
    window.deleteProduct = async function(id) {
        const product = allProducts.find(p => p.id === id);
        if (!product) return;

        if (!confirm(`Are you sure you want to delete "${product.name}"? This cannot be undone.`)) return;

        try {
            // 1. Delete from database
            const { error: dbError } = await supabaseClient
                .from('products')
                .delete()
                .eq('id', id);
            if (dbError) throw dbError;

            // 2. Delete image from storage (if it's not a placeholder)
            if (product.image_url && product.image_url.includes('shoe-images')) {
                const fileName = product.image_url.split('/').pop();
                await supabaseClient.storage.from('shoe-images').remove([fileName]);
            }

            loadProducts();
        } catch (error) {
            alert("Error deleting product: " + error.message);
        }
    }
  </script>
</body>
</html>
