<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers - SoulHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><h2>SoulHub</h2></div>
    <div class="user-profile">
      <div class="avatar" id="user-initial">S</div>
      <div class="user-info">
        <h4 id="user-name">Loading...</h4>
        <span class="role-badge" id="user-role">...</span>
      </div>
    </div>
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Overview
      </a>
      <a href="inventory.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
        Inventory
      </a>
      <a href="sales.html" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Sales (POS)
      </a>
      <a href="reports.html" class="nav-item">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        Reports
      </a>
      <a href="customers.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Customers
      </a>
      <!-- Owner only links -->
      <a href="staff.html" class="nav-item owner-only" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
        Staff
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" id="logout-btn">Log Out</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="top-header">
      <button class="menu-toggle" id="menu-toggle">☰</button>
      <h1>Customer Directory</h1>
    </header>

    <div class="inventory-header">
      <input type="text" id="search-customer" class="search-bar" placeholder="Search by name, phone, or email..." style="max-width: 400px; margin-bottom: 0;">
      <button class="btn-gold" onclick="openCustomerModal()">+ Add Customer</button>
    </div>

    <div class="table-responsive" style="margin-top: 20px;">
      <table class="data-table">
        <thead>
          <tr>
            <th>Customer Name</th>
            <th>Phone Number</th>
            <th>Email</th>
            <th>Notes</th>
            <th>Date Added</th>
          </tr>
        </thead>
        <tbody id="customers-table-body">
          <tr><td colspan="5" style="text-align: center; color: var(--muted);">Loading customers...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- ADD CUSTOMER MODAL -->
    <div class="modal" id="customer-modal">
      <div class="modal-content" style="max-width: 500px;">
        <span class="close-modal" onclick="closeCustomerModal()">&times;</span>
        <h2 style="font-family: 'Cinzel', serif; margin-bottom: 20px;">Add New Customer</h2>
        <form id="add-customer-form">
          <div class="form-grid">
            <div class="form-group full">
              <label>Full Name</label>
              <input type="text" id="c-name" required placeholder="e.g. Jane Doe">
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="c-phone" placeholder="e.g. 0712 345 678">
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="c-email" placeholder="e.g. jane@example.com">
            </div>
            <div class="form-group full">
              <label>Notes (Preferences, Sizes, etc.)</label>
              <input type="text" id="c-notes" placeholder="e.g. Prefers size 38, loves gold accents">
            </div>
          </div>
          <button type="submit" class="btn-gold" style="width: 100%; margin-top: 20px;">Save Customer</button>
        </form>
      </div>
    </div>
  </main>

  <!-- LOAD SHARED APP.JS -->
  <script src="app.js"></script>
  
  <!-- PAGE SPECIFIC LOGIC -->
  <script>
    let allCustomers = [];

    window.addEventListener('load', () => {
        loadCustomers();

        // Search functionality
        document.getElementById('search-customer').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allCustomers.filter(c => 
                c.full_name.toLowerCase().includes(term) || 
                (c.phone && c.phone.includes(term)) ||
                (c.email && c.email.toLowerCase().includes(term))
            );
            renderCustomerTable(filtered);
        });
    });

    async function loadCustomers() {
        const { data, error } = await supabaseClient
            .from('customers')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            document.getElementById('customers-table-body').innerHTML = `<tr><td colspan="5" style="color: var(--error);">Error: ${error.message}</td></tr>`;
            return;
        }

        allCustomers = data;
        renderCustomerTable(allCustomers);
    }

    function renderCustomerTable(customers) {
        const tbody = document.getElementById('customers-table-body');
        tbody.innerHTML = '';

        if (customers.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--muted);">No customers found.</td></tr>`;
            return;
        }

        customers.forEach(c => {
            const dateStr = new Date(c.created_at).toLocaleDateString('en-KE', { month: 'short', day: 'numeric', year: 'numeric' });
            
            tbody.innerHTML += `
                <tr>
                  <td style="font-weight: 600; color: var(--gold-light);">${c.full_name}</td>
                  <td>${c.phone || '-'}</td>
                  <td>${c.email || '-'}</td>
                  <td style="font-size: 13px; color: var(--muted); max-width: 250px;">${c.notes || '-'}</td>
                  <td>${dateStr}</td>
                </tr>
            `;
        });
    }

    // --- MODAL CONTROLS ---
    window.openCustomerModal = () => document.getElementById('customer-modal').classList.add('active');
    window.closeCustomerModal = () => {
        document.getElementById('customer-modal').classList.remove('active');
        document.getElementById('add-customer-form').reset();
    }

    // --- SAVE CUSTOMER ---
    document.getElementById('add-customer-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.textContent = "Saving...";
        btn.disabled = true;

        const newCustomer = {
            full_name: document.getElementById('c-name').value,
            phone: document.getElementById('c-phone').value,
            email: document.getElementById('c-email').value,
            notes: document.getElementById('c-notes').value,
        };

        const { error } = await supabaseClient.from('customers').insert([newCustomer]);

        if (error) {
            alert("Error saving customer: " + error.message);
            btn.textContent = "Save Customer";
            btn.disabled = false;
        } else {
            closeCustomerModal();
            loadCustomers(); // Refresh table
        }
    });
  </script>
</body>
</html>
