      <button class="logout-btn" id="logout-btn">Log Out</button>
    </div>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="top-header">
      <button class="menu-toggle" id="menu-toggle">☰</button>
      <h1>Shop Settings</h1>
    </header>

    <div id="settings-container" style="display: none;">
      <form id="settings-form" class="settings-form">
        
        <!-- SHOP PROFILE -->
        <div class="form-section">
          <h3>Shop Profile (Receipt Header)</h3>
          <div class="form-grid">
            <div class="form-group full">
              <label>Shop Name</label>
              <input type="text" id="set-name" required>
            </div>
            <div class="form-group full">
              <label>Physical Address</label>
              <input type="text" id="set-address" required>
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="set-phone" required>
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="set-email" required>
            </div>
          </div>
        </div>

        <!-- FINANCIALS -->
        <div class="form-section">
          <h3>Financial Settings</h3>
          <div class="form-grid">
            <div class="form-group">
              <label>VAT Rate (%) - Kenya</label>
              <input type="number" id="set-vat" required min="0" max="100" step="0.1">
            </div>
            <div class="form-group">
              <label>Low Stock Alert Threshold</label>
              <input type="number" id="set-threshold" required min="1">
            </div>
          </div>
        </div>

        <!-- RECEIPT FOOTER -->
        <div class="form-section">
          <h3>Receipt Customization</h3>
          <div class="form-grid">
            <div class="form-group full">
              <label>Receipt Footer Message</label>
              <input type="text" id="set-footer" required>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-gold" style="width: 100%; margin-top: 20px;">Save Settings</button>
      </form>
    </div>

    <!-- Unauthorized View -->
    <div id="unauthorized-view" style="display: none;">
      <div class="unauthorized-panel">
        <h2>Access Denied</h2>
        <p>Only the Shop Owner can access settings.</p>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
  
  <script>
    window.addEventListener('load', async () => {
        setTimeout(async () => {
            if (window.currentUserRole !== 'owner') {
                document.getElementById('unauthorized-view').style.display = 'block';
                return;
            }

            document.getElementById('settings-container').style.display = 'block';
            await loadSettings();
        }, 500); 
    });

    async function loadSettings() {
        const { data, error } = await supabaseClient
            .from('shop_settings')
            .select('*')
            .eq('id', 1)
            .single();

        if (error) {
            alert("Error loading settings: " + error.message);
            return;
        }

        // Populate the form
        document.getElementById('set-name').value = data.shop_name || '';
        document.getElementById('set-address').value = data.address || '';
        document.getElementById('set-phone').value = data.phone || '';
        document.getElementById('set-email').value = data.email || '';
        document.getElementById('set-vat').value = data.vat_rate || 16;
        document.getElementById('set-threshold').value = data.low_stock_threshold || 2;
        document.getElementById('set-footer').value = data.receipt_footer || '';
    }

    document.getElementById('settings-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.textContent = "Saving...";
        btn.disabled = true;

        const updatedSettings = {
            shop_name: document.getElementById('set-name').value,
            address: document.getElementById('set-address').value,
            phone: document.getElementById('set-phone').value,
            email: document.getElementById('set-email').value,
            vat_rate: parseFloat(document.getElementById('set-vat').value),
            low_stock_threshold: parseInt(document.getElementById('set-threshold').value),
            receipt_footer: document.getElementById('set-footer').value
        };

        // We use upsert to ensure it always updates row 1
        const { error } = await supabaseClient
            .from('shop_settings')
            .upsert({ id: 1, ...updatedSettings });

        if (error) {
            alert("Error saving settings: " + error.message);
        } else {
            alert("Settings saved successfully!");
        }

        btn.textContent = "Save Settings";
        btn.disabled = false;
    });
  </script>
</body>
</html>
