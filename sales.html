<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales (POS) - SoulHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* POS Specific Styles */
    .pos-layout {
      display: flex;
      gap: 20px;
      height: calc(100vh - 120px);
    }
    
    /* Left Side: Product Selection */
    .pos-products {
      flex: 2;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pos-search {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
    }
    .pos-search:focus { border-color: var(--gold); outline: none; }
    
    .pos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      overflow-y: auto;
      padding-right: 5px;
    }
    .pos-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }
    .pos-card:hover { border-color: var(--gold); transform: translateY(-2px); }
    .pos-card img { width: 100%; height: 120px; object-fit: cover; }
    .pos-card-info { padding: 10px; }
    .pos-card-info h4 { font-size: 14px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pos-card-info p { font-size: 12px; color: var(--gold-light); font-family: "Cinzel", serif; }

    /* Right Side: Cart */
    .pos-cart {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-width: 320px;
    }
    .cart-header {
      padding: 20px;
      border-bottom: 1px solid #333;
      font-family: "Cinzel", serif;
      font-size: 20px;
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .cart-item-info h5 { font-size: 14px; margin-bottom: 3px; }
    .cart-item-info span { font-size: 12px; color: var(--muted); }
    .cart-item-price { font-family: "Cinzel", serif; color: var(--gold-light); }
    .remove-btn { background: transparent; border: none; color: var(--error); cursor: pointer; font-size: 16px; padding: 5px; }
    
    .cart-footer {
      padding: 20px;
      border-top: 1px solid var(--border);
      background: #111;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 24px;
      font-family: "Cinzel", serif;
      margin-bottom: 20px;
    }
    .total-row span:last-child { color: var(--gold); }
    
    /* Size Selector Modal */
    .size-selector {
      display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;
    }
    .size-btn {
      padding: 10px 15px; border: 1px solid var(--border); background: #222;
      color: var(--text); border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .size-btn:hover:not(:disabled) { border-color: var(--gold); background: rgba(209,178,124,0.1); }
    .size-btn:disabled { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }

    /* Receipt Styles */
    .receipt {
      font-family: monospace;
      color: #111;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }
    .receipt h2 { text-align: center; margin-bottom: 10px; font-family: "Cinzel", serif; }
    .receipt p { margin: 5px 0; font-size: 14px; }
    .receipt-line { border-bottom: 1px dashed #ccc; margin: 10px 0; }
    .receipt-item { display: flex; justify-content: space-between; font-size: 12px; }
    
    @media (max-width: 900px) {
      .pos-layout { flex-direction: column; height: auto; }
      .pos-cart { min-width: 100%; height: 400px; }
    }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><h2>SoulHub</h2></div>
    <div class="user-profile">
      <div class="avatar" id="user-initial">S</div>
      <div class="user-info">
        <h4 id="user-name">Loading...</h4>
        <span class="role-badge" id="user-role">...</span>
      </div>
    </div>
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Overview
      </a>
      <a href="inventory.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
        Inventory
      </a>
      <a href="sales.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Sales (POS)
      </a>
      <a href="reports.html" class="nav-item">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        Reports
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" id="logout-btn">Log Out</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <button class="menu-toggle" id="menu-toggle">☰</button>
      <h1>Point of Sale</h1>
    </header>

    <div class="pos-layout">
      
      <!-- LEFT: Product Search & Grid -->
      <div class="pos-products">
        <input type="text" id="pos-search" class="pos-search" placeholder="Search shoes by name or brand...">
        <div class="pos-grid" id="pos-grid">
          <p style="color: var(--muted);">Loading products...</p>
        </div>
      </div>

      <!-- RIGHT: Shopping Cart -->
      <div class="pos-cart">
        <div class="cart-header">Current Order</div>
        <div class="cart-items" id="cart-items">
          <p style="color: var(--muted); font-size: 14px; text-align: center; margin-top: 20px;">Cart is empty</p>
        </div>
        <div class="cart-footer">
          <div class="total-row">
            <span>Total</span>
            <span id="cart-total">KSh 0.00</span>
          </div>
          <button class="btn-gold" id="checkout-btn" style="width: 100%; padding: 15px; font-size: 18px;" disabled>Checkout</button>
        </div>
      </div>

    </div>
  </main>

  <!-- SIZE SELECTOR MODAL -->
  <div class="modal" id="size-modal">
    <div class="modal-content" style="max-width: 400px;">
      <span class="close-modal" onclick="closeSizeModal()">&times;</span>
      <h2 id="modal-shoe-name" style="font-family: 'Cinzel', serif; margin-bottom: 5px;">Shoe Name</h2>
      <p id="modal-shoe-price" style="color: var(--gold-light); margin-bottom: 20px;">KSh 0.00</p>
      <p style="font-size: 14px; color: var(--muted);">Select Size:</p>
      <div class="size-selector" id="size-selector">
        <!-- Size buttons injected here -->
      </div>
    </div>
  </div>

  <!-- RECEIPT MODAL -->
  <div class="modal" id="receipt-modal">
    <div class="modal-content" style="max-width: 400px; background: #fff; color: #000;">
      <div id="receipt-content" class="receipt">
        <!-- Receipt content injected here -->
      </div>
      <button class="btn-gold" onclick="window.print()" style="width: 100%; margin-top: 20px;">Print Receipt</button>
      <button class="btn-gold" onclick="closeReceiptModal()" style="width: 100%; margin-top: 10px; background: transparent; border: 1px solid #000; color: #000;">New Sale</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let allProducts = [];
    let cart = [];
    let selectedProduct = null;

    window.addEventListener('load', () => {
        loadPOSProducts();
        
        document.getElementById('pos-search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(term) || 
                (p.brand && p.brand.toLowerCase().includes(term))
            );
            renderPOSGrid(filtered);
        });

        document.getElementById('checkout-btn').addEventListener('click', processCheckout);
    });

    async function loadPOSProducts() {
        const { data, error } = await supabaseClient
            .from('products')
            .select('*')
            .order('name', { ascending: true });

        if (!error) {
            allProducts = data;
            renderPOSGrid(allProducts);
        }
    }

    function renderPOSGrid(products) {
        const grid = document.getElementById('pos-grid');
        grid.innerHTML = '';

        if (products.length === 0) {
            grid.innerHTML = `<p style="color: var(--muted);">No products found.</p>`;
            return;
        }

        products.forEach(p => {
            const priceStr = new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES' }).format(p.price);
            grid.innerHTML += `
                <div class="pos-card" onclick="openSizeModal('${p.id}')">
                  <img src="${p.image_url || 'https://via.placeholder.com/300x200?text=No+Image'}" alt="${p.name}">
                  <div class="pos-card-info">
                    <h4>${p.name}</h4>
                    <p>${priceStr}</p>
                  </div>
                </div>
            `;
        });
    }

    // --- SIZE SELECTION LOGIC ---
    window.openSizeModal = function(productId) {
        selectedProduct = allProducts.find(p => p.id === productId);
        if (!selectedProduct) return;

        document.getElementById('modal-shoe-name').textContent = selectedProduct.name;
        document.getElementById('modal-shoe-price').textContent = new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES' }).format(selectedProduct.price);

        const sizeSelector = document.getElementById('size-selector');
        sizeSelector.innerHTML = '';
        
        const sizes = [38, 39, 40, 41, 42];
        sizes.forEach(size => {
            const qty = selectedProduct[`size_${size}`];
            const btn = document.createElement('button');
            btn.className = 'size-btn';
            btn.textContent = `Size ${size} (${qty} left)`;
            btn.disabled = qty === 0;
            btn.onclick = () => addToCart(selectedProduct, size);
            sizeSelector.appendChild(btn);
        });

        document.getElementById('size-modal').classList.add('active');
    }

    window.closeSizeModal = () => document.getElementById('size-modal').classList.remove('active');

    // --- CART LOGIC ---
    function addToCart(product, size) {
        // Check if item already in cart
        const existingItem = cart.find(item => item.product.id === product.id && item.size === size);
        
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({
                product: product,
                size: size,
                quantity: 1
            });
        }
        
        closeSizeModal();
        renderCart();
    }

    function renderCart() {
        const cartContainer = document.getElementById('cart-items');
        const totalEl = document.getElementById('cart-total');
        const checkoutBtn = document.getElementById('checkout-btn');

        if (cart.length === 0) {
            cartContainer.innerHTML = `<p style="color: var(--muted); font-size: 14px; text-align: center; margin-top: 20px;">Cart is empty</p>`;
            totalEl.textContent = "KSh 0.00";
            checkoutBtn.disabled = true;
            return;
        }

        let total = 0;
        cartContainer.innerHTML = '';
        
        cart.forEach((item, index) => {
            const itemTotal = item.product.price * item.quantity;
            total += itemTotal;
            
            cartContainer.innerHTML += `
                <div class="cart-item">
                  <div class="cart-item-info">
                    <h5>${item.product.name}</h5>
                    <span>Size ${item.size} x ${item.quantity}</span>
                  </div>
                  <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="cart-item-price">${new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES' }).format(itemTotal)}</div>
                    <button class="remove-btn" onclick="removeFromCart(${index})">&times;</button>
                  </div>
                </div>
            `;
        });

        totalEl.textContent = new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES' }).format(total);
        checkoutBtn.disabled = false;
    }

    window.removeFromCart = function(index) {
        cart.splice(index, 1);
        renderCart();
    }

    // --- CHECKOUT & RECEIPT ---
    async function processCheckout() {
        const checkoutBtn = document.getElementById('checkout-btn');
        checkoutBtn.textContent = "Processing...";
        checkoutBtn.disabled = true;

        try {
            const total = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
            const receiptNumber = `SH-${Date.now().toString().slice(-6)}`;
            
            // 1. Format items for database
            const itemsData = cart.map(item => ({
                id: item.product.id,
                name: item.product.name,
                size: item.size,
                quantity: item.quantity,
                price: item.product.price
            }));

            // 2. Save Sale to Database
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            const { error: saleError } = await supabaseClient.from('sales').insert([{
                receipt_number: receiptNumber,
                total_amount: total,
                items: itemsData,
                sold_by: session.user.id
            }]);

            if (saleError) throw saleError;

            // 3. Update Inventory Stock
            for (const item of cart) {
                const currentQty = item.product[`size_${item.size}`];
                const newQty = currentQty - item.quantity;
                
                await supabaseClient
                    .from('products')
                    .update({ [`size_${item.size}`]: newQty })
                    .eq('id', item.product.id);
            }

            // 4. Show Receipt
            showReceipt(receiptNumber, total, itemsData);

            // 5. Reset Cart
            cart = [];
            renderCart();
            loadPOSProducts(); // Refresh stock grid

        } catch (error) {
            alert("Checkout failed: " + error.message);
            checkoutBtn.textContent = "Checkout";
            checkoutBtn.disabled = false;
        }
    }

    function showReceipt(receiptNo, total, items) {
        const date = new Date().toLocaleString();
        let itemsHtml = '';
        
        items.forEach(i => {
            itemsHtml += `
                <div class="receipt-item">
                    <span>${i.quantity}x ${i.name} (Sz ${i.size})</span>
                    <span>KSh ${i.price * i.quantity}</span>
                </div>
            `;
        });

        document.getElementById('receipt-content').innerHTML = `
            <h2>SoulHub</h2>
            <p style="text-align: center; font-size: 12px;">High-end shoe boutique</p>
            <div class="receipt-line"></div>
            <p>Receipt: ${receiptNo}</p>
            <p>Date: ${date}</p>
            <div class="receipt-line"></div>
            ${itemsHtml}
            <div class="receipt-line"></div>
            <p style="font-size: 18px; font-weight: bold; display: flex; justify-content: space-between;">
                <span>TOTAL:</span>
                <span>KSh ${total.toLocaleString()}</span>
            </p>
            <div class="receipt-line"></div>
            <p style="text-align: center; font-size: 12px;">Thank you for shopping with us!</p>
        `;

        document.getElementById('receipt-modal').classList.add('active');
    }

    window.closeReceiptModal = () => {
        document.getElementById('receipt-modal').classList.remove('active');
        document.getElementById('checkout-btn').textContent = "Checkout";
        document.getElementById('checkout-btn').disabled = false;
    }
  </script>
</body>
</html>
