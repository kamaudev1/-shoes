<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SoulHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --gold-primary: #d1b27c;
            --gold-gradient: linear-gradient(135deg, #e2cba7 0%, #c19b52 100%);
            --font-heading: 'Cinzel', serif;
            --font-body: 'Lato', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: var(--font-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
        }
        h1 {
            font-family: var(--font-heading);
            font-size: 36px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #a0a0a0;
        }
        input {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }
        input:focus {
            border-color: var(--gold-primary);
        }
        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 8px;
            font-family: var(--font-heading);
            font-size: 18px;
            background: var(--gold-gradient);
            color: #111;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            transition: filter 0.3s;
        }
        .btn:hover { filter: brightness(1.1); }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #a0a0a0;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--gold-primary); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome Back</h1>
        <form action="#" method="POST">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
